<style>
/* tools/proofs/serpent.html — the year-round serpent, prototyped on Deckhand's real sea strip (Winter 2.1, design C8;
   winter-animation.md B9). Generated by the winter proofs from Deckhand.html's own wave layers (#waves, #wv1–#wv3,
   foam). Not part of Deckhand.html. URL: ?scene=pass|attack|ice  &vb=x,y,w,h (a window of the 1920 × 200 strip)
   &w=px (the drawn width) &t=s (a still frame) &play=1 (real-time). window.render(t) draws one frame. */
:root{--cream:#F8F2E4; --grid:#EADFC6; --sand:#E6D5B8; --turq:#40E0D0; --paleturq:#D8F6F1; --navy:#17324D; --turq-light:#BFEFEA; --turq-mid:#8FE5DC; --coral:#FF7A6B;}
html,body{margin:0; background:var(--cream);}
svg{display:block}
.wvSand{fill:var(--sand)} .wvLight{fill:var(--turq-light)} .wvMid{fill:var(--turq-mid)}
.foam path{fill:none; stroke:#fff; stroke-width:2.6; stroke-linecap:round; vector-effect:non-scaling-stroke;}
.btHull{fill:var(--navy)} .btSail{fill:var(--turq)} .btSail2{fill:var(--paleturq)}
.btStay{fill:none; stroke:var(--navy); stroke-width:.9; stroke-linecap:round} .btMastFix{stroke:var(--navy); stroke-width:1.3; stroke-linecap:round}
.btBurgee{fill:var(--navy)} .btStripe{stroke:var(--paleturq); stroke-width:.9; opacity:.9}
.glBody{fill:#fff; stroke:var(--navy); stroke-width:1.1; vector-effect:non-scaling-stroke} .gl path, .gl circle{fill:var(--navy)} .glLegs{fill:none !important; stroke:var(--navy); stroke-width:.8}
.body{fill:var(--navy)} .ghost{fill:var(--navy); opacity:.2} .eye{fill:var(--paleturq)} .mouth{fill:none; stroke:var(--paleturq); stroke-width:1.1; stroke-linecap:round}
.ripple{fill:none; stroke:#fff; stroke-width:1.5; stroke-linecap:round; opacity:.95} .splash{fill:#fff}
.ice{fill:#E6EFFB} .iceEdge{fill:#fff} .hole{fill:#5FCBC4; stroke:#4C7BD9; stroke-width:1; stroke-opacity:.7} .shard{fill:#F4F8FF; stroke:#4C7BD9; stroke-width:.8}
.crack{fill:none; stroke:#4C7BD9; stroke-opacity:.6; stroke-width:1}

<script>
var Q = new URLSearchParams(location.search), SCENE = Q.get("scene") || "pass";
var W = 1920, WL = 180.7, NS = "http://www.w3.org/2000/svg";
var T1 = 11.2, T2 = 7.1, T3 = 15.8;
(function(){ var vb = Q.get("vb"), sv = document.getElementById("scene");
  if (vb){ var v = vb.split(",").map(Number), w = +(Q.get("w") || v[2]); sv.setAttribute("viewBox", v.join(" ")); sv.setAttribute("width", w); sv.setAttribute("height", Math.round(w * v[3] / v[2])); } })();
function $(id){ return document.getElementById(id); }
function r1(n){ return Math.round(n * 10) / 10; }
function smooth(a, b, x){ var t = Math.max(0, Math.min(1, (x - a) / (b - a))); return t * t * (3 - 2 * t); }
function ease(t){ t = Math.max(0, Math.min(1, t)); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function easeOut(t){ t = Math.max(0, Math.min(1, t)); return 1 - Math.pow(1 - t, 3); }
function easeIn(t){ t = Math.max(0, Math.min(1, t)); return t * t * t; }

/* ---- the boat: Deckhand's drawing, on the swell ---- */
var BOAT = '<g class="btWake"></g><path class="btStay" d="M20.6,4 L35.6,24.6"/><path class="btSail" d="M20,4 V23.5 H8.5 Q12,13 20,4 Z"/><path class="btSail2" d="M21.4,7.4 L34,23.8 L22.6,23.8 Q24,15.5 21.4,7.4 Z"/><path class="btMastFix" d="M20,3 V27"/><path class="btBurgee" d="M20,2.6 L24.6,3.9 L20,5.2 Z"/>' +
  '<path class="btHull" d="M5,26.8 L37,25 Q34.6,31 29.5,34.8 L11.5,34.8 Q7,33 5,26.8 Z"/><path class="btStripe" d="M7.2,29 L34.4,28.2"/>' +
  '<g class="gl" transform="translate(20,2.6) scale(.8)"><path class="glLegs" d="M-.6,-3.4 L-.8,0 M1.8,-3.4 L1.8,0"/><path class="glBody" d="M-11,-6.2 L-6,-7.4 C-3,-9.6 2,-10 4.4,-9.6 C4.2,-11.8 5.4,-13.2 7.2,-13.2 C8.8,-13.2 9.6,-12.2 9.8,-11.2 L9.6,-10.2 C8.8,-9.2 8.2,-8.6 8.2,-7.6 C8,-5 5,-3.2 .5,-3.2 C-3.5,-3.2 -6.4,-4.4 -8,-5.4 Z"/><path d="M-12.4,-6.4 C-7,-9.4 0,-9.6 5,-8 C4,-5.8 0,-4.6 -4,-4.8 C-7,-5 -10,-5.8 -12.4,-6.4 Z"/><path d="M9.7,-11.6 L13,-10.8 L9.6,-10.1 Z"/><circle cx="7.6" cy="-11.8" r=".7"/></g>';
$("boat").innerHTML = '<g id="boatT">' + BOAT + '</g>';
var MAST = 806.4;

/* ---- the serpent: one centerline, one outline ---- */
var S = { L: 176, lam: 80, f: .42, A: 17, v: 84 };
function thick(s, L){
  if (s < 2) return 3.4; if (s < 7) return 3.4 + (s - 2) * 1.44; if (s < 12) return 10.6 + (s - 7) * .08; if (s < 20) return 11 - (s - 12) * .42;
  if (s < L * .7) return 7.6 + .45 * Math.sin(s / 10); return Math.max(.9, 7.6 * (1 - (s - L * .7) / (L * .3)));
}
/* the pass's depth along the lane: deep at the entry and exit (it slithers up and down a slope), a dive mid-pass */
function passDepth(x){ return 1.5 + 46 * smooth(W * .72, W * .84, x) + 46 * (1 - smooth(W * .12, W * .24, x)) + 34 * Math.max(0, 1 - Math.abs(x - W * .47) / (W * .05)); }
function geom(t, o){
  var pts = [], L = S.L, n = L / 2;
  for (var i = 0; i <= n; i++){
    var s = i * 2, x = o.xh + s;
    var A = S.A * smooth(10, 40, s) * (1 - .45 * smooth(L * .7, L, s)) * (o.amp == null ? 1 : o.amp);
    var headUp = s < 36 ? (19 + o.lift) * Math.pow(1 - s / 36, 1.3) : 0;
    var D = o.depth(x, s);
    var y = o.wl + D - headUp - A * Math.sin(2 * Math.PI * (s / S.lam + S.f * t)) + (s < 22 ? 1.3 * Math.sin(2 * Math.PI * S.f * t) * (1 - s / 22) : 0);
    pts.push([x, y, s]);
  }
  return pts;
}
function outline(pts){
  var top = [], bot = [], n = pts.length;
  for (var i = 0; i < n; i++){
    var a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)], tx = b[0] - a[0], ty = b[1] - a[1], l = Math.hypot(tx, ty) || 1, nx = ty / l, ny = -tx / l;
    if (ny > 0){ nx = -nx; ny = -ny; }
    var w = thick(pts[i][2], S.L) / 2; top.push([pts[i][0] + nx * w, pts[i][1] + ny * w, nx, ny]); bot.push([pts[i][0] - nx * w, pts[i][1] - ny * w]);
  }
  /* smooth the outline with quadratic midpoints so the body reads as one curve */
  function curve(list){ var d = ""; for (var j = 1; j < list.length - 1; j++){ var m = [(list[j][0] + list[j + 1][0]) / 2, (list[j][1] + list[j + 1][1]) / 2]; d += " Q" + r1(list[j][0]) + "," + r1(list[j][1]) + " " + r1(m[0]) + "," + r1(m[1]); } return d; }
  var tl = pts[n - 1], rb = bot.slice().reverse();
  var d = "M" + r1(pts[0][0] - 1.2) + "," + r1(pts[0][1]) + " L" + r1(top[0][0]) + "," + r1(top[0][1]) + curve(top) + " L" + r1(tl[0]) + "," + r1(tl[1]) +
    " L" + r1(tl[0] + 5) + "," + r1(tl[1] - 6.5) + " L" + r1(top[n - 4][0]) + "," + r1(top[n - 4][1]) + " L" + r1(rb[0][0]) + "," + r1(rb[0][1]) + curve(rb) + " Z";
  /* the horn and the spines: small, only where the back faces up */
  var sp = "M" + r1(top[4][0]) + "," + r1(top[4][1]) + " L" + r1(top[10][0] + top[10][2] * 7 + 5) + "," + r1(top[10][1] + top[10][3] * 7) + " L" + r1(top[9][0]) + "," + r1(top[9][1]) + " Z";
  for (i = 18; i < n - 20; i += 6){ var p = top[i], q = top[i + 1]; if (p[3] > -.82) continue;
    sp += " M" + r1(p[0]) + "," + r1(p[1]) + " L" + r1((p[0] + q[0]) / 2 + p[2] * 3.4 + 1.6) + "," + r1((p[1] + q[1]) / 2 + p[3] * 3.4) + " L" + r1(q[0]) + "," + r1(q[1]) + " Z"; }
  return { d: d, sp: sp, top: top };
}
var STATS = { frames: 0, ms: 0 };
function drawSerpent(lane, t, o){
  var t0 = performance.now(), pts = geom(t, o), O = outline(pts), wl = o.wl;
  $("body" + lane).setAttribute("d", O.d); $("spines" + lane).setAttribute("d", O.sp);
  var e = pts[3], tp = O.top[3]; $("eye" + lane).setAttribute("cx", r1(e[0] + tp[2] * 2.4)); $("eye" + lane).setAttribute("cy", r1(e[1] + tp[3] * 2.4));
  $("eye" + lane).style.fill = o.coral ? "var(--coral)" : "";
  $("mouth" + lane).setAttribute("d", "M" + r1(pts[0][0] - .6) + "," + r1(pts[0][1] + .8) + " Q" + r1(pts[3][0]) + "," + r1(pts[3][1] + 2.2) + " " + r1(pts[7][0]) + "," + r1(pts[7][1] + 1.6));
  $("ghost").setAttribute("d", o.ice ? "" : O.d);
  /* ripples where the top outline crosses the surface; a splash while the head is just breaking it */
  var rp = "", prev = null;
  O.top.forEach(function(p, j){ var up = p[1] < wl - .3; if (prev !== null && up !== prev) rp += " M" + r1(p[0] - 7) + "," + r1(wl + .6) + " Q" + r1(p[0]) + "," + r1(wl + 3) + " " + r1(p[0] + 7) + "," + r1(wl + .6); prev = up; });
  $("ripples").setAttribute("d", rp);
  var hy = O.top[2][1], sp = "";
  if (hy < wl + 1 && hy > wl - 6) sp = '<circle class="splash" cx="' + r1(pts[2][0] - 5) + '" cy="' + r1(wl - 4) + '" r="1.3"/><circle class="splash" cx="' + r1(pts[2][0] - 1) + '" cy="' + r1(wl - 7.5) + '" r="1"/><circle class="splash" cx="' + r1(pts[2][0] + 3.5) + '" cy="' + r1(wl - 5) + '" r="1.1"/>';
  $("splash").innerHTML = sp;
  if (o.ice) iceHoles(O.top, pts, wl);
  STATS.frames++; STATS.ms += performance.now() - t0;
}
/* ---- the sea's own layers, on the clock ---- */
function waves(t, frozen){
  ["wv1g", "wv2g", "foamAg", "foamBg", "wv3g"].forEach(function(id){ $(id).style.display = frozen ? "none" : ""; });
  if (frozen) return;
  var p1 = (t / T1) % 1, p2 = (t / T2) % 1, p3 = (t / T3) % 1;
  $("wv1g").setAttribute("transform", "translate(" + r1(-768 * p1) + " 112) scale(1.92 .73333)");
  $("foamAg").setAttribute("transform", "translate(" + r1(-768 * p1) + " 112) scale(1.92 .73333)");
  $("foamBg").setAttribute("transform", "translate(" + r1(-768 * p1) + " 112) scale(1.92 .73333)");
  $("wv2g").setAttribute("transform", "translate(" + r1(-307.2 * p2) + " 112) scale(1.92 .73333)");
  $("wv3g").setAttribute("transform", "translate(" + r1(-1536 * p3) + " 112) scale(1.92 .73333)");
  var fb = (t / (2 * T1)) % 1, fo = fb < .2 ? .9 * fb / .2 : fb < .45 ? .9 - .45 * (fb - .2) / .25 : fb < .6 ? .45 * (1 - (fb - .45) / .15) : 0;
  $("foamAg").style.opacity = fo; $("foamBg").style.opacity = ((t / (2 * T1) + .5) % 1) < .2 ? .5 : 0;
}
function boatAt(t, struck){
  var heave = 2.6 * Math.sin(2 * Math.PI * t / T1) + .8 * Math.sin(2 * Math.PI * t / T2), pitch = 2.2 * Math.cos(2 * Math.PI * t / T1) + struck;
  $("boatT").setAttribute("transform", "translate(" + r1(MAST - 19) + " " + r1(156 + heave) + ") rotate(" + r1(pitch) + " 19 32) scale(.95)");
}
/* ---- the frozen sea ---- */
var ICE_TOP = 112 + 84 * .73333;
function iceSheet(){
  var s = '<rect class="ice" x="0" y="' + r1(ICE_TOP) + '" width="1920" height="' + r1(200 - ICE_TOP) + '"/><path class="iceEdge" d="M0,' + r1(ICE_TOP) + ' ';
  for (var x = 0; x <= 1920; x += 14) s += 'L' + x + ',' + r1(ICE_TOP + 2.5 + 2 * Math.sin(x * .37)) + ' ';
  s += 'L1920,' + r1(ICE_TOP) + ' Z"/>';
  for (var k = 0; k < 14; k++){ var cx = 60 + k * 137, d = "M" + cx + "," + r1(ICE_TOP + 4); for (var y = ICE_TOP + 4; y < 200; y += 6) { cx += Math.sin(k * 7 + y) * 6; d += " L" + r1(cx) + "," + r1(y); } s += '<path class="crack" d="' + d + '"/>'; }
  for (k = 0; k < 20; k++) s += '<path d="M' + (k * 97 + 20) + ',' + r1(ICE_TOP + 9 + (k % 3) * 6) + ' l' + (70 + (k % 4) * 20) + ',-2" stroke="#fff" stroke-width="1.8" stroke-linecap="round" opacity=".85"/>';
  return s;
}
var HOLES = [];
function iceHoles(top, pts, wl){   // a hole wherever a span breaks the surface; the holes stay
  var run = null;
  top.forEach(function(p, j){ var up = p[1] < wl - .5; if (up && !run) run = [p[0], p[0]]; if (up) run[1] = p[0];
    if ((!up || j === top.length - 1) && run){ var a = run[0] - 8, b = run[1] + 8, hit = false;
      HOLES.forEach(function(h){ if (a < h[1] && b > h[0]){ h[0] = Math.min(h[0], a); h[1] = Math.max(h[1], b); hit = true; } });
      if (!hit) HOLES.push([a, b]); run = null; } });
  var s = "";
  HOLES.forEach(function(h){ s += '<path class="hole" d="M' + r1(h[0]) + ',' + r1(wl) + ' L' + r1(h[0] + 3) + ',' + r1(wl + 4) + ' L' + r1(h[1] - 3) + ',' + r1(wl + 4.6) + ' L' + r1(h[1]) + ',' + r1(wl) + ' Z"/>' +
    '<path class="shard" d="M' + r1(h[0] - 1) + ',' + r1(wl + .5) + ' l-3.5,-5 l5.5,1.8 Z M' + r1(h[1] + 1) + ',' + r1(wl + .5) + ' l3.8,-5.4 l.9,5 Z"/>'; });
  $("iceHolesBack").innerHTML = s;
}

/* ---- the scenes ---- */
var SCENES = {
  /* one 26 s pass in the far lane: swim left at a constant 84 px/s, the wave running back along the body */
  pass: { dur: 26, draw: function(t){ waves(t); boatAt(t, 0);
    drawSerpent("Far", t, { xh: W + 60 - S.v * t, wl: WL, lift: 0, depth: function(x){ return passDepth(x); } }); hide("Near"); } },
  ice: { dur: 26, draw: function(t){ waves(t, true); boatAt(0, 0);
    drawSerpent("Far", t, { xh: W + 60 - S.v * t, wl: ICE_TOP + 3, lift: 0, ice: true, depth: function(x){ return passDepth(x); } }); hide("Near"); } },
  /* the attack (20 s, the live act's beats): the tell, the slither in, the rear, the lunge and bite, the miss, the sink */
  attack: { dur: 20, draw: function(t){ waves(t); var struck = 0;
    var x0 = 1240, xStop = MAST + 46, xh, lift = 0, D = 3, amp = 1, coral = false;
    if (t < 2.8){ xh = x0 + 20 * (1 - t / 2.8); lift = -11; D = 26; amp = .2; }
    else if (t < 10){ var k = easeOut((t - 2.8) / 7.2); xh = x0 - (x0 - xStop) * k; lift = -11 + 11 * smooth(2.8, 4.2, t); D = 26 - 23 * smooth(2.8, 4.4, t); }
    else { xh = xStop; }
    if (t >= 10 && t < 11){ lift = 40 * easeOut((t - 10) / .6) - 4 * smooth(10.6, 11, t); coral = true; }
    if (t >= 11 && t < 12.4){ lift = 36 - 6 * ease((t - 11) / 1.4); xh = xStop - 20 * ease((t - 11) / 1.4); coral = true; }
    if (t >= 12.4 && t < 13.6){ xh = xStop - 20; lift = 30 - 44 * easeIn((t - 12.4) / 1.2); coral = true; }
    if (t >= 13.6 && t < 15.7){ xh = xStop - 20 + 8 * ease((t - 13.6) / 2.1); lift = -14 + 22 * ease((t - 13.6) / 2.1); }
    if (t >= 15.7){ var q = (t - 15.7) / 4.3; xh = xStop - 12 + 70 * ease(q); lift = 8 - 22 * easeIn(q); D = 3 + 46 * easeIn(q); }
    if (t > 12.1 && t < 14.5) struck = 7 * Math.exp(-(t - 12.1) * 2.2) * Math.cos((t - 12.1) * 9);
    boatAt(t, struck);
    drawSerpent("Near", t, { xh: xh, wl: WL + 1, lift: lift, amp: amp, coral: coral, depth: function(x, s){ return D + (s > 30 ? 0 : 0); } }); hide("Far");
    var bub = ""; if (t < 2.8) for (var b = 0; b < 3; b++){ var ph = ((t * .9 + b * .33) % 1); bub += '<circle cx="' + r1(x0 + 6 + b * 9) + '" cy="' + r1(WL - 2 - ph * 7) + '" r="' + r1(1 + ph) + '" fill="none" stroke="#fff" stroke-width="1" opacity="' + r1(1 - ph) + '"/>'; }
    $("bubbles").innerHTML = bub; } }
};
function hide(lane){ ["body", "spines", "mouth"].forEach(function(k){ $(k + lane).setAttribute("d", ""); }); $("eye" + lane).setAttribute("cx", -99); }
if (SCENE === "ice") $("iceLayer").innerHTML = "", document.querySelector("#scene").insertBefore(Object.assign(document.createElementNS(NS, "g"), { innerHTML: iceSheet() }), $("iceHolesBack"));
window.render = function(t){ SCENES[SCENE].draw(t); };
window.SCENE_DUR = SCENES[SCENE].dur; window.STATS = STATS;
render(+(Q.get("t") || 6));
if (Q.get("play")){ var t0 = performance.now(); (function loop(now){ render(((now - t0) / 1000) % SCENES[SCENE].dur); requestAnimationFrame(loop); })(t0); }
</script>
