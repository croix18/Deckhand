<style>
/* tools/proofs/serpent.html — the year-round serpent, prototyped on Deckhand's real sea strip (Winter 2.2 rework).
   Not part of Deckhand.html. URL: ?scene=pass|battle|ice  &end=a|b|c (the battle's ending; random when left out)
   &vb=x,y,w,h (a window of the 1920 × 200 strip) &w=px (the drawn width) &t=s (a still frame) &play=1 (real time).
   window.render(t) draws one frame; window.SCENE_DUR is the act's length.
   The body is a spine chain that follows its head (every point travels the path the head took, fixed segment
   lengths), so nothing ever slides backward along the body; the head is keyed in time and the neck is posed on top. */

html,body{margin:0; background:var(--cream);}
svg{display:block}
.wvSand{fill:var(--sand)} .wvLight{fill:var(--turq-light)} .wvMid{fill:var(--turq-mid)}
.foam path{fill:none; stroke:#fff; stroke-width:2.6; stroke-linecap:round; vector-effect:non-scaling-stroke;}
.btHull{fill:var(--navy)} .btSail{fill:var(--turq)} .btSail2{fill:var(--paleturq)}
.btStay{fill:none; stroke:var(--navy); stroke-width:.9; stroke-linecap:round} .btMastFix{stroke:var(--navy); stroke-width:1.3; stroke-linecap:round}
.btBurgee{fill:var(--navy)} .btStripe{stroke:var(--paleturq); stroke-width:.9; opacity:.9}
.glBody{fill:#fff; stroke:var(--navy); stroke-width:1.1; vector-effect:non-scaling-stroke} .gl path, .gl circle{fill:var(--navy)} .glLegs{fill:none !important; stroke:var(--navy); stroke-width:.8}
.sk{fill:var(--navy)} .belly{fill:var(--teal)} .eyeW{fill:var(--paleturq)} .mouthIn{fill:var(--coral)}
.lineP{fill:none; stroke:var(--paleturq); stroke-width:1.1; stroke-linecap:round; stroke-linejoin:round}
.rip{fill:none; stroke:#fff; stroke-width:1.6; stroke-linecap:round} .drop{fill:#fff}
.puff{fill:#fff; stroke:var(--navy); stroke-width:1}
.pop{font:900 16px system-ui, sans-serif; fill:var(--navy); stroke:var(--cream); stroke-width:3; paint-order:stroke; text-anchor:middle}
.star{fill:#FFD27A; stroke:var(--navy); stroke-width:.8; stroke-linejoin:round}
.ice{fill:#E6EFFB} .iceEdge{fill:#fff} .crack{fill:none; stroke:#4C7BD9; stroke-opacity:.6; stroke-width:1}
.crackNew{fill:none; stroke:#4C7BD9; stroke-width:1.3; stroke-linejoin:round; stroke-linecap:round}
.hole{fill:#5FCBC4; stroke:#4C7BD9; stroke-width:1} .shard{fill:#F4F8FF; stroke:#4C7BD9; stroke-width:.8; stroke-linejoin:round}
.skin{fill:#F4F8FF; stroke:#4C7BD9; stroke-width:.8}

<script>

function $(id){ return document.getElementById(id); }
function r1(n){ return Math.round(n * 10) / 10; }
function cl(x, a, b){ return x < a ? a : x > b ? b : x; }
function smooth(a, b, x){ var t = cl((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); }
function ease(t){ t = cl(t, 0, 1); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function easeOut(t){ t = cl(t, 0, 1); return 1 - Math.pow(1 - t, 3); }
function wrapA(a){ while (a > PI) a -= 2 * PI; while (a < -PI) a += 2 * PI; return a; }
/* kf: eased scalar keys [[t, v], …] — every key is a hold-and-settle point */
function kf(K, t){ if (t <= K[0][0]) return K[0][1]; for (var i = 1; i < K.length; i++) if (t < K[i][0]){ var a = K[i - 1], b = K[i]; return a[1] + (b[1] - a[1]) * ease((t - a[0]) / (b[0] - a[0])); } return K[K.length - 1][1]; }

function spring(t, t0, amp, f, d){ if (t < t0) return 0; var u = t - t0; return amp * Math.exp(-d * u) * Math.sin(2 * PI * f * u); }
function bump(t, a, b){ return t <= a || t >= b ? 0 : Math.sin(PI * (t - a) / (b - a)); }
function hash(k){ var s = Math.sin(k * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); }
/* track: a path keyed in time [[t, x, y, "stop"?], …] — cubic Hermite with Catmull-Rom tangents, zero tangents at holds */
function track(K){
  var n = K.length, M = [];
  function same(a, b){ return a[1] === b[1] && a[2] === b[2]; }

    var a = K[Math.max(0, i - 1)], b = K[Math.min(n - 1, i + 1)];
    if ((i > 0 && same(K[i - 1], K[i])) || (i < n - 1 && same(K[i + 1], K[i])) || K[i][3] === "stop") M.push([0, 0]);

    if (t >= K[n - 1][0]) return [K[n - 1][1] + M[n - 1][0] * (t - K[n - 1][0]), K[n - 1][2] + M[n - 1][1] * (t - K[n - 1][0])];

/* ---------- the serpent ---------- */
/* make(): samples the head's path once (120 Hz) into a trail with arc length, a smoothed facing (−1 left … +1 right)
   and the places the path breaks the surface. Every frame the spine is read off that trail. */
function makeSerpent(o){

function spine(S, t){

  for (var i = 1; i <= S.N; i++){
    var a = Ah - i * S.seg;

    var u = A[j] > A[j - 1] ? (a - A[j - 1]) / (A[j] - A[j - 1]) : 0;
    S.px[i] = S.X[j - 1] + (S.X[j] - S.X[j - 1]) * u; S.py[i] = S.Y[j - 1] + (S.Y[j] - S.Y[j - 1]) * u; S.pf[i] = S.F[j - 1] + (S.F[j] - S.F[j - 1]) * u;

/* the neck pose: rebuild the first segments from the shoulders with fixed lengths — raise (toward upright),

var ANG = new Float64Array(16);
function poseNeck(S, P){

var TOPX = new Float64Array(64), TOPY = new Float64Array(64), BOTX = new Float64Array(64), BOTY = new Float64Array(64), NX = new Float64Array(64), NY = new Float64Array(64);
function curve(xs, ys, from, to, step){ var d = ""; for (var j = from; j !== to; j += step){ var k = j + step; d += " Q" + r1(xs[j]) + "," + r1(ys[j]) + " " + r1((xs[j] + xs[k]) / 2) + "," + r1((ys[j] + ys[k]) / 2); } return d; }
